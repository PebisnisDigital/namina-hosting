name: Export NAMINA for DomainMurah

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "hosting-dist/**"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read independent hosting repository
        uses: actions/checkout@v4

      - name: Prepare build tools
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run typecheck
          node --import tsx --test tests/*.test.ts

      - name: Generate static HTML package
        run: npm run build:hosting

      - name: Prepare cPanel PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none

      - name: Verify PHP syntax and generator permissions
        run: |
          php -l hosting-dist/api/generator.php
          php -l hosting-dist/api/generator-lib.php
          php -l hosting-dist/api/setup-generator.php
          npm run test:generator-api

      - name: Prepare browser tests
        run: npx playwright install --with-deps chromium

      - name: Verify desktop, mobile, and interactions
        run: npm run test:hosting

      - name: Keep browser diagnostics if testing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: namina-browser-test-errors
          path: test-results/
          if-no-files-found: ignore

      - name: Upload ready-to-host files
        uses: actions/upload-artifact@v4
        with:
          name: namina-html-domainmurah
          path: hosting-dist/
          include-hidden-files: true
          if-no-files-found: error

      - name: Store generated pages in the hosting repository
        run: |
          git add -f hosting-dist/
          if git diff --cached --quiet; then
            echo "Hosting files are already up to date."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh static hosting export"
            git push origin HEAD:main
          fi

  deploy_domainmurah:
    name: Deploy NAMINA to DomainMurah
    needs: export
    # During ZIP-first review, pushes must never upload to DomainMurah.
    # FTPS may only run on an explicitly requested export workflow.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.NAMINA_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: namina-domainmurah-production
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Read deployment script
        uses: actions/checkout@v4

      - name: Download tested website build
        uses: actions/download-artifact@v4
        with:
          name: namina-html-domainmurah
          path: hosting-dist/

      - name: Install encrypted FTP deploy client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload website over FTPS, preserving published clients
        env:
          NAMINA_FTPS_HOST: ${{ secrets.NAMINA_FTPS_HOST }}
          NAMINA_FTPS_PORT: ${{ secrets.NAMINA_FTPS_PORT }}
          NAMINA_FTPS_USER: ${{ secrets.NAMINA_FTPS_USER }}
          NAMINA_FTPS_PASSWORD: ${{ secrets.NAMINA_FTPS_PASSWORD }}
        run: bash scripts/deploy-domainmurah.sh hosting-dist
