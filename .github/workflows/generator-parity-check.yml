name: Verify NAMINA generator parity before cPanel update

on:
  pull_request:
    paths:
      - "src/pages/OriginalStudioEditor.tsx"
      - "src/static/generatorPrompts.ts"
      - "src/generator.css"
      - "tests/generator-prompt-sync.test.ts"
      - ".github/workflows/generator-parity-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build cPanel release
        run: npm run build:hosting

      - name: PHP runtime for API check
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none

      - name: Check PHP backend
        run: |
          php -l hosting-dist/api/generator.php
          php -l hosting-dist/api/generator-lib.php
          php -l hosting-dist/api/setup-generator.php
          npm run test:generator-api

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Test generator desktop and mobile
        run: npm run test:hosting

      - name: Keep browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: namina-generator-parity-errors
          path: test-results/
          if-no-files-found: ignore
