---
# NAMINA / DomainMurah: production deployment with strict file allowlist.
# On each manual cPanel "Deploy HEAD Commit":
# 1. Verify target, source, private folder and file safety (read-only).
# 2. Make a private backup of the files that will be overwritten.
# 3. Copy only approved application paths; NEVER deploy clients/* or delete files.
# To roll back cPanel deployment policy, revert this file to staging-only.
deployment:
  tasks:
    - /bin/bash scripts/deploy-cpanel-safe.sh --check
    - /usr/bin/env NAMINA_CPANEL_APPROVE_PRODUCTION=YES_DEPLOY_NAMINA /bin/bash scripts/deploy-cpanel-safe.sh --apply
